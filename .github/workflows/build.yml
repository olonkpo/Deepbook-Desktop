name: Build installers

# Builds a Windows .exe, macOS .dmg (Apple Silicon + Intel), and a Linux
# .AppImage/.deb, each on its own runner.
#
# - Push to main:      builds only, artifacts attached to the run (for
#                       manual download/testing) — nothing published.
# - Push a tag "vX.Y.Z": builds AND publishes a GitHub Release with the
#                       installers plus the latest*.yml manifests that the
#                       in-app "Check for Updates" button reads. Bump
#                       "version" in package.json to match the tag first.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            flags: "--win"
          - os: macos-latest
            arch: arm64
            flags: "--mac"
          - os: macos-latest
            arch: x64
            flags: "--mac --x64"
            npm_install_flags: "--cpu=x64 --os=darwin"
          - os: ubuntu-latest
            arch: x64
            flags: "--linux"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install ${{ matrix.npm_install_flags }}

      - name: Determine publish mode
        id: publish
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "mode=always" >> "$GITHUB_OUTPUT"
          else
            echo "mode=never" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.flags }} --publish=${{ steps.publish.outputs.mode }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbook-studio-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
