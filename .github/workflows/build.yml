name: Build installers

# Builds a Windows .exe, macOS .dmg (Apple Silicon + Intel), and a Linux
# .AppImage/.deb, each on its own runner.
#
# - Push to main:      lints, builds, and smoke-tests (Linux) — artifacts
#                       attached to the run for manual download/testing.
#                       Nothing published. This is the safe way to check a
#                       change before it reaches anyone's installed app.
# - Push a tag "vX.Y.Z": same as above, AND (if it all passes) publishes a
#                       GitHub Release with the installers plus the
#                       latest*.yml manifests the in-app "Check for
#                       Updates" button reads. Bump "version" in
#                       package.json to match the tag first.
#                       Tag a prerelease first (e.g. v1.2.0-beta.1) to try
#                       a real build without pushing it to existing
#                       installs — electron-updater ignores prereleases by
#                       default, so only re-tagging the final vX.Y.Z number
#                       actually reaches users. See README.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            flags: "--win"
          - os: macos-latest
            arch: arm64
            flags: "--mac"
          - os: macos-latest
            arch: x64
            flags: "--mac --x64"
            npm_install_flags: "--cpu=x64 --os=darwin"
          - os: ubuntu-latest
            arch: x64
            flags: "--linux"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install ${{ matrix.npm_install_flags }}

      - name: Determine publish mode
        id: publish
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "mode=always" >> "$GITHUB_OUTPUT"
          else
            echo "mode=never" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.flags }} --publish=${{ steps.publish.outputs.mode }}

      # Cheap sanity check: does the packaged app even survive launching?
      # Only Linux, since it's the one runner where a headless display
      # (xvfb) is trivial to set up. Doesn't exercise every feature — just
      # catches "this build is completely broken" before anyone downloads
      # or auto-updates to it.
      - name: Smoke test (launch check)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          APPIMAGE=$(ls release/*.AppImage)
          chmod +x "$APPIMAGE"
          # --appimage-extract-and-run avoids needing FUSE, which GitHub's
          # ubuntu-latest runners don't have installed by default — without
          # this flag every run fails on "libfuse.so.2 not found" regardless
          # of whether the app itself is fine.
          xvfb-run --auto-servernum "$APPIMAGE" --appimage-extract-and-run --no-sandbox &
          APP_PID=$!
          sleep 10
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "::error::App exited within 10s of launch — likely crashed on startup"
            exit 1
          fi
          echo "App still running after 10s — looks healthy"
          kill $APP_PID

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbook-studio-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn
